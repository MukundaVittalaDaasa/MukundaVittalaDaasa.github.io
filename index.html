<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf7f0;--fg:#2b2622;--muted:#8a8177;--line:#e4ddcf;--accent:#a4562b;--soft:rgba(0,0,0,.04);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--fg:#ece5d8;--muted:#9a9083;--line:#2f2a24;--accent:#d08a5b;--soft:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--bg:#1a1714;--fg:#ece5d8;--muted:#9a9083;--line:#2f2a24;--accent:#d08a5b;--soft:rgba(255,255,255,.05)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1.19rem;line-height:1.7}
main{max-width:36rem;margin:0 auto;padding:4.5rem 1.5rem 3rem}
.kn{font-family:var(--kn)}
.offer{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.05em;font-family:var(--kn);white-space:pre-line}
h1{text-align:center;font-weight:400;font-size:2.1rem;margin:1.2rem 0 .1rem}

.tag{text-align:center;font-style:italic;color:var(--muted);margin:.8rem 0 0;white-space:pre-line}
.intro{text-align:center;margin:1rem 0 0;white-space:pre-line}
hr{border:0;border-top:1px solid var(--line);width:3rem;margin:2.2rem auto}
.tabs{display:flex;justify-content:center;gap:.5rem;margin:0 0 1.6rem;flex-wrap:wrap}
.tabs a{color:var(--muted);text-decoration:none;font-size:.95rem;padding:.3rem 1rem;border:1px solid var(--line);border-radius:99px}
.tabs a.on{color:var(--accent);border-color:var(--accent);background:var(--soft)}
#q{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:.95rem;padding:.4rem 0;outline:none}
.chips,.bar{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}

.chip.on{color:var(--accent);border-color:var(--accent)}
.count{font-size:.8rem;color:var(--muted);margin:.9rem 0 .2rem}
.item{display:block;padding:1.1rem 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.item:first-child{border-top:1px solid var(--line)}
.title{font-family:var(--kn);font-size:1.05rem;font-weight:600}
.meta{font-size:.85rem;color:var(--muted);letter-spacing:.03em}
.draft{font-style:italic}
.pallavi{font-family:var(--kn);font-size:.9rem;color:var(--accent);margin-top:.2rem}
.exc{font-size:.95rem;color:var(--muted);margin-top:.3rem}
.empty{color:var(--muted);font-style:italic;padding:1.5rem 0}
.back{color:var(--muted);font-size:.9rem;text-decoration:none}
.dt{font-family:var(--kn);font-size:1.4rem;font-weight:600;margin:1.5rem 0 .2rem;line-height:1.4}

.info{background:none;border:1px solid var(--line);color:var(--accent);border-radius:99px;width:1.6rem;height:1.6rem;font-size:.85rem;line-height:1;cursor:pointer;padding:0}

.md img{max-width:100%;border-radius:8px}

.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + .8rem);right:1rem;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.4rem}

<body>
<button class="toggle" id="theme" aria-label="Toggle light or dark">◐</button>
<main id="app"><p class="empty">Loading…</p></main>
<script>
var SITE={},INDEX=[],V="",state={q:"",tag:"",lang:"en",tab:"",shown:30,rid:0},PAGE=30;
var app=document.getElementById("app");
var LABEL_DEFS=[
["navAbout","About","Tab name for the About page (if no About title is set)"],
["showMore","Show more","Button that shows more items in a long list"],
["aboutEmpty","This page is being written.","Shown on the About page until you write it"],
["loading","Loading…","Shown while a piece is loading"],
["search","Search","Search box hint"],
["countOne","{n} piece","Shown when there is 1 item ({n} = the number)"],
["countMany","{n} pieces","Shown when there are several items"],
["empty","Nothing here yet.","Shown when a list is empty"],
["back","← Back","Back link on a page"],
["readFull","Read the full text ↗","Button that opens the full text link"],
["fullTag","full text ↗","Small tag in the list when a full text link exists"],
["inProgress","in progress","Marks an unfinished piece"],
["summary","Summary","Heading of the summary box"],
["tapHint","Tap a section to see its meaning","Hint shown above sections that have meanings"],
["showAll","Show all meanings","Button text"],
["hideAll","Hide all meanings","Button text"],
["shownIn","shown in {lang}","Note shown when the chosen language is missing"],
["ankita","Ankita","Label before the ankita"],
["raga","Raga","Label before the raga"],
["tala","Tala","Label before the tala"],
["pallavi","ಪಲ್ಲವಿ","Heading of the pallavi"],
["anupallavi","ಅನುಪಲ್ಲವಿ","Heading of the anupallavi"],
["charana","ಚರಣ","Heading of each charana (a number follows)"],
["loadError","Could not load the content. Please try again later.","Shown if the content cannot load"]
];
var DEFAULT_LABELS={};LABEL_DEFS.forEach(function(d){DEFAULT_LABELS[d[0]]=d[1];});
var LANGS=[["en","English"],["kn","ಕನ್ನಡ"],["hi","हिन्दी"]];
var DEFAULT_TYPES=[{name:"Kriti",layout:"kriti",plural:"Kritis"},{name:"Ugabhoga",layout:"verses",plural:"Ugabhogas"},{name:"Blog",layout:"article",plural:"Blogs"}];
var PAPERS={cream:"#faf7f0",white:"#ffffff",grey:"#f3f2ef",sage:"#f1f4ec"};

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function el(tag,cls,text,parent){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}
function L(key,vars){
  var s=(SITE.labels&&SITE.labels[key])||DEFAULT_LABELS[key]||key;
  if(vars)Object.keys(vars).forEach(function(k){s=s.split("{"+k+"}").join(vars[k]);});
  return s;
}
function safeUrl(u){u=(u||"").trim();if(/^(https?:\/\/|mailto:)/i.test(u))return u;if(/^[a-z][a-z0-9+.\-]*:/i.test(u))return "";return u;}
function inlineMd(text,parent){
  var re=/(\*\*[^*]+\*\*|\*[^*\n]+\*|\[[^\]]+\]\([^)\s]+\))/g,last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    var t=m[0];
    if(t.indexOf("**")===0){el("strong","",t.slice(2,-2),parent);}
    else if(t.charAt(0)==="*"){el("em","",t.slice(1,-1),parent);}
    else{
      var mm=t.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/),u=safeUrl(mm[2]);
      if(u){var a=el("a","",mm[1],parent);a.href=u;if(/^https?:/i.test(u)){a.target="_blank";a.rel="noopener";}}
      else parent.appendChild(document.createTextNode(mm[1]));
    }
    last=re.lastIndex;
  }
  if(last<text.length)parent.appendChild(document.createTextNode(text.slice(last)));
}
function md(src,parent){
  String(src||"").replace(/\r/g,"").split(/\n\s*\n/).forEach(function(b){
    b=b.trim();if(!b)return;
    var im=b.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    if(im){var u=safeUrl(im[2]);if(u){var f=el("figure","",null,parent),img=el("img","",null,f);img.src=u;img.alt=im[1];img.loading="lazy";if(im[1])el("figcaption","",im[1],f);}return;}
    if(/^### /.test(b)){inlineMd(b.slice(4),el("h3","",null,parent));return;}
    if(/^## /.test(b)){inlineMd(b.slice(3),el("h2","",null,parent));return;}
    if(/^> /.test(b)){inlineMd(b.split("\n").map(function(l){return l.replace(/^>\s?/,"");}).join("\n"),el("blockquote","",null,parent));return;}
    if(/^- /.test(b)){var ul=el("ul","",null,parent);b.split("\n").forEach(function(l){inlineMd(l.replace(/^-\s+/,""),el("li","",null,ul));});return;}
    var p=el("p","",null,parent);
    b.split("\n").forEach(function(l,i){if(i)p.appendChild(document.createElement("br"));inlineMd(l,p);});
  });
}
function stripMd(s){return String(s||"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/[#>*_`]/g,"").replace(/\s+/g," ").trim();}

function slug(s){var x=String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return x||"other";}
function firstOf(w,lay){
  if(lay==="kriti")return(w.pallavi||"").split("\n")[0];
  if(lay==="verses")return((w.verses||[])[0]||"").split("\n")[0];
  var s=w.summary&&(w.summary.en||w.summary.kn||w.summary.hi);
  return String(s||stripMd(w.body||"")).replace(/\s+/g," ").slice(0,150);
}

function baseTypes(){return(SITE.types&&SITE.types.length)?SITE.types:DEFAULT_TYPES;}
function types(){
  var out=baseTypes().slice(),seen={};out.forEach(function(t){seen[t.name]=1;});
  INDEX.forEach(function(w){if(!seen[w.type]){seen[w.type]=1;out.push({name:w.type,layout:w.l||"kriti",plural:w.type});}});
  return out;
}
function typeInfo(name){return types().filter(function(t){return t.name===name;})[0];}
function layoutOf(w){var t=typeInfo(w.type);return t?t.layout:(w.l||(w.body?"article":w.verses?"verses":"kriti"));}
var _sorted=null;
function sorted(){if(!_sorted)_sorted=INDEX.slice().sort(function(a,b){return(b.date||"").localeCompare(a.date||"");});return _sorted;}
function ofType(name){return sorted().filter(function(w){return w.type===name;});}
function availableTabs(){
  return types().filter(function(t){return ofType(t.name).length;}).map(function(t){
    return{slug:slug(t.name),name:t.name,label:t.plural||(t.name+"s")};
  });
}
function hasAbout(){return true;}
function vals(o){return o?Object.keys(o).map(function(k){return o[k];}):[];}
function haystack(w){return[w.title,w.type,w.first,(w.tags||[]).join(" ")].join(" ").toLowerCase();}
function langName(k){var r=LANGS.filter(function(l){return l[0]===k;})[0];return r?r[1]:k;}
function pick(o){
  if(!o)return null;
  if(o[state.lang])return{text:o[state.lang],lang:state.lang};
  for(var i=0;i<LANGS.length;i++){var k=LANGS[i][0];if(o[k])return{text:o[k],lang:k,fallback:true};}
  return null;
}
function hasAny(o){return!!(o&&(o.en||o.kn||o.hi));}

function header(parent){
  if(SITE.offering)el("div","offer",SITE.offering,parent);
  var h=el("h1","",SITE.name||"",parent);
  if(SITE.kn)el("span","",SITE.kn,h);
  if(SITE.tagline)el("p","tag",SITE.tagline,parent);
  if(SITE.intro)el("p","intro",SITE.intro,parent);
  el("hr","",null,parent);
}
function footer(parent){
  var f=el("footer","",null,parent);
  if(SITE.footer)el("div","ft",SITE.footer,f);
  var start=SITE.copyrightYear||"",now=String(new Date().getFullYear());
  var years=start&&start!==now&&now>start?start+"–"+now:(start||now);
  el("div","copy","© "+years+" "+(SITE.name||"")+(SITE.kn?" · "+SITE.kn:""),f);
  if(SITE.licenseName){
    var l=el("div","copy","Licensed under ",f);
    if(SITE.licenseUrl){var a=el("a","",SITE.licenseName,l);a.href=SITE.licenseUrl;a.target="_blank";a.rel="license noopener";}
    else l.appendChild(document.createTextNode(SITE.licenseName));
  }
  if(SITE.licenseNote)el("div","copy note2 ft",SITE.licenseNote,f);
}
function tabsBar(parent,ts,active){
  var nav=el("nav","tabs",null,parent);
  ts.forEach(function(t){var a=el("a",t.slug===active?"on":"",t.label,nav);a.href="#/t/"+t.slug;});
  var ab=el("a","about"===active?"on":"",SITE.aboutTitle||L("navAbout"),nav);ab.href="#/about";
}
function item(parent,w){
  var lay=layoutOf(w),a=el("a","item",null,parent);a.href="#/"+encodeURIComponent(w.id);
  el("div","title",w.title,a);
  var bits=[lay==="article"?w.date:"",w.status==="draft"?L("inProgress"):"",w.link?L("fullTag"):""].filter(Boolean).join(" · ");
  if(bits)el("div","meta"+(w.status==="draft"?" draft":""),bits,a);
  if(w.first){
    if(lay==="article")el("div","exc",w.first,a);
    else el("div","pallavi",(lay==="kriti"?L("pallavi")+": ":"")+w.first,a);
  }
}
function renderAbout(){
  el("div","dt",SITE.aboutTitle||L("navAbout"),app);
  if(SITE.about&&SITE.about.trim())md(SITE.about,el("div","md",null,app));
  else el("p","empty",L("aboutEmpty"),app);
}
function renderHome(tabSlug){
  var ts=availableTabs();
  if(!tabSlug||(tabSlug!=="about"&&!ts.some(function(t){return t.slug===tabSlug;})))tabSlug=ts.length?ts[0].slug:"about";
  if(state.tab!==tabSlug){state.tab=tabSlug;state.q="";state.tag="";state.shown=PAGE;}
  app.innerHTML="";header(app);tabsBar(app,ts,tabSlug);
  if(tabSlug==="about"){renderAbout();footer(app);window.scrollTo(0,0);return;}
  var tab=ts.filter(function(t){return t.slug===tabSlug;})[0],list=ofType(tab.name);
  var tagset={};list.forEach(function(w){(w.tags||[]).forEach(function(t){tagset[t]=1;});});
  var names=Object.keys(tagset).sort();
  if(state.tag&&names.indexOf(state.tag)<0)state.tag="";
  var q=el("input","",null,app);q.id="q";q.type="search";q.placeholder=L("search");q.value=state.q;
  var chips=el("div","chips",null,app);
  if(names.length>1)names.forEach(function(t){
    var c=el("button","chip"+(state.tag===t?" on":""),t,chips);
    c.onclick=function(){state.tag=state.tag===t?"":t;state.shown=PAGE;renderHome(tabSlug);};
  });
  var count=el("div","count","",app),box=el("div","",null,app),moreWrap=el("div","",null,app);
  function draw(){
    box.innerHTML="";moreWrap.innerHTML="";
    var term=state.q.trim().toLowerCase();
    var rows=list.filter(function(w){return(!state.tag||(w.tags||[]).indexOf(state.tag)>-1)&&(!term||haystack(w).indexOf(term)>-1);});
    count.textContent=L(rows.length===1?"countOne":"countMany",{n:rows.length});
    if(!rows.length)el("div","empty",L("empty"),box);
    rows.slice(0,state.shown).forEach(function(w){item(box,w);});
    if(rows.length>state.shown){var b=el("button","chip more",L("showMore"),moreWrap);b.onclick=function(){state.shown+=PAGE;draw();};}
  }
  q.oninput=function(){state.q=q.value;state.shown=PAGE;draw();};
  draw();footer(app);
}
function loadWork(entry){
  if(entry._full)return Promise.resolve(entry);
  return fetch(entry.f+"?v="+encodeURIComponent(V||Date.now())).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(full){return Object.assign({},entry,full);});
}
function renderWork(id){
  var entry=sorted().filter(function(k){return k.id===id;})[0];
  if(!entry){location.hash="";return;}
  var my=++state.rid;
  app.innerHTML="";header(app);el("p","empty",L("loading"),app);window.scrollTo(0,0);
  loadWork(entry).then(function(w){if(my===state.rid)showWork(w,entry);})
  .catch(function(){if(my!==state.rid)return;app.innerHTML="";el("p","empty",L("loadError"),app);});
}
function showWork(w,entry){
  var lay=layoutOf(w),list=ofType(w.type),i=list.indexOf(entry);
  var M=w.meanings||{},refresh=[],panels=[];
  app.innerHTML="";
  var back=el("a","back",L("back"),app);back.href="#/t/"+slug(w.type);
  el("div","dt",w.title,app);
  var meta=[w.type];
  if(lay!=="article"){if(w.ankita)meta.push(L("ankita")+": "+w.ankita);if(w.raga)meta.push(L("raga")+": "+w.raga);if(w.tala)meta.push(L("tala")+": "+w.tala);}
  if(w.date)meta.push(w.date);
  el("div","meta",meta.filter(Boolean).join(" · "),app);
  if(w.audio){var au=el("audio","",null,app);au.controls=true;au.src=w.audio;}
  if(w.link){var rb=el("a","readbtn",L("readFull"),app);rb.href=w.link;if(/^https?:/i.test(w.link)){rb.target="_blank";rb.rel="noopener";}}
  var bar=el("div","bar",null,app);
  if(hasAny(w.summary)){
    var sb=el("div","sum",null,app);el("div","lbl",L("summary"),sb);
    var st=el("div","",null,sb),sf=el("div","fb",null,sb);
    refresh.push(function(){var p=pick(w.summary);st.textContent=p?p.text:"";sf.textContent=p&&p.fallback?"("+L("shownIn",{lang:langName(p.lang)})+")":"";});
  }
  function sec(label,text,m){
    var wrap=el("div","sec",null,app),head=el("div","sechead",null,wrap);
    el("span","lbl",label,head);
    var has=hasAny(m),body=el("div","verse"+(has?" tap":""),text,wrap);
    if(!has)return;
    var btn=el("button","info","ⓘ",head);btn.type="button";btn.setAttribute("aria-label",L("summary"));btn.setAttribute("aria-expanded","false");
    var panel=el("div","mean",null,wrap);panel.hidden=true;panels.push(panel);
    var txt=el("div","",null,panel),fb=el("div","fb",null,panel);
    var toggle=function(){panel.hidden=!panel.hidden;btn.setAttribute("aria-expanded",String(!panel.hidden));};
    btn.onclick=toggle;body.onclick=toggle;
    refresh.push(function(){var p=pick(m);txt.textContent=p?p.text:"";fb.textContent=p&&p.fallback?"("+L("shownIn",{lang:langName(p.lang)})+")":"";});
  }
  if(lay==="kriti"){
    if(w.pallavi)sec(L("pallavi"),w.pallavi,M.pallavi);
    if(w.anupallavi)sec(L("anupallavi"),w.anupallavi,M.anupallavi);
    (w.charanas||[]).forEach(function(c,k){sec(L("charana")+" "+(k+1),c,(M.charanas||[])[k]);});
  }else if(lay==="verses"){
    var vs=w.verses||[];
    vs.forEach(function(v,k){sec(vs.length>1?String(k+1):"",v,(M.verses||[])[k]);});
  }else{
    md(w.body,el("div","md",null,app));
  }
  var avail=LANGS.map(function(l){return l[0];}).filter(function(k){
    if(w.summary&&w.summary[k])return true;
    var all=[M.pallavi,M.anupallavi].concat(M.charanas||[]).concat(M.verses||[]);
    return all.some(function(o){return o&&o[k];});
  });
  var chipEls=[];
  if(avail.length>1)LANGS.forEach(function(l){
    if(avail.indexOf(l[0])<0)return;
    var b=el("button","chip"+(state.lang===l[0]?" on":""),l[1],bar);
    b.onclick=function(){state.lang=l[0];lsSet("kriti-lang",l[0]);chipEls.forEach(function(c){c[0].className="chip"+(c[1]===state.lang?" on":"");});refresh.forEach(function(f){f();});};
    chipEls.push([b,l[0]]);
  });
  if(panels.length){
    var all=el("button","chip",L("showAll"),bar),open=false;
    all.onclick=function(){open=!open;panels.forEach(function(p){p.hidden=!open;});all.textContent=open?L("hideAll"):L("showAll");};
    var hint=el("div","hint",L("tapHint"),app);app.insertBefore(hint,bar.nextSibling);
  }
  refresh.forEach(function(f){f();});
  if(w.notes)el("div","note",w.notes,app);
  var pn=el("div","pn",null,app),prev=list[i+1],next=list[i-1];
  var l1=el("a","",prev?"← "+prev.title:"",pn);if(prev)l1.href="#/"+encodeURIComponent(prev.id);
  var r1=el("a","",next?next.title+" →":"",pn);if(next)r1.href="#/"+encodeURIComponent(next.id);
  footer(app);window.scrollTo(0,0);
}
function route(){
  var h=location.hash||"";
  if(!h||h==="#"||h==="#/")return renderHome("");
  var t=h.match(/^#\/t\/(.+)$/);
  if(t)return renderHome(decodeURIComponent(t[1]));
  var m=h.match(/^#\/(.+)$/),k=m?decodeURIComponent(m[1]):"";
  if(k==="about")return renderHome("about");
  if(k==="writings")return renderHome("");
  renderWork(k);
}
function shade(hex,p){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(c+(255-c)*p);}
  return"#"+[f(r),f(g),f(b)].map(function(c){return("0"+c.toString(16)).slice(-2);}).join("");
}
function applyTheme(){
  var t=SITE.theme||{},css="",root="";
  var acc=/^#[0-9a-f]{6}$/i.test(t.accent||"")?t.accent:"";
  if(acc){root+="--accent:"+acc+";";var d=shade(acc,.35);css+="@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--accent:"+d+"}}:root[data-theme=\"dark\"]{--accent:"+d+"}";}
  if(PAPERS[t.paper])root+="--bg:"+PAPERS[t.paper]+";";
  if(t.font==="sans")root+="--body:system-ui,-apple-system,\"Noto Sans Kannada\",\"Noto Sans Devanagari\",sans-serif;--kn:\"Noto Sans Kannada\",\"Noto Sans Devanagari\",sans-serif;";
  var fs={s:"15px",l:"18px"}[t.size];
  var out=(root?":root{"+root+"}":"")+css+(fs?"html{font-size:"+fs+"}":"");
  document.getElementById("themeStyle").textContent=out;
}
function getJson(u){
  return fetch(u+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();});
}
function loadAll(){
  return getJson("data/site.json").then(function(s){
    return getJson("data/index.json").then(function(ix){SITE=s||{};INDEX=ix.works||[];V=String(ix.v||"");});
  }).catch(function(e){
    if(String(e.message)!=="404")throw e;
    return getJson("data.json").then(function(d){
      SITE=d.site||{};
      var ts=baseTypes();
      INDEX=(d.works||[]).map(function(w){
        var t=ts.filter(function(x){return x.name===w.type;})[0];
        var lay=t?t.layout:(w.body?"article":w.verses?"verses":"kriti");
        return Object.assign({},w,{_full:true,l:lay,first:firstOf(w,lay)});
      });
    });
  });
}
loadAll().then(function(){
  state.lang=lsGet("kriti-lang")||SITE.defaultLang||"en";
  document.title=SITE.title||((SITE.name||"")+(SITE.kn?" · "+SITE.kn:""));
  applyTheme();
  window.addEventListener("hashchange",route);
  route();
}).catch(function(){app.innerHTML="";el("p","empty",L("loadError"),app);});
document.getElementById("theme").onclick=function(){
  var r=document.documentElement;
  var dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
};
</script>
