<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Editor</title>
<style>
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf7f0; --fg:#2b2622; --muted:#8a8177; --line:#e4ddcf; --accent:#a4562b; --card:#fffdf8; }
@media (prefers-color-scheme: dark) { :root { --bg:#1a1714; --fg:#ece5d8; --muted:#9a9083; --line:#2f2a24; --accent:#d08a5b; --card:#211d19; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Noto Sans Kannada",sans-serif; font-size:16px; line-height:1.5; }
main { max-width:40rem; margin:0 auto; padding:1.5rem 1.2rem 4rem; }
h1 { font-size:1.3rem; font-weight:600; margin:0 0 .2rem; }
h2 { font-size:1rem; margin:2rem 0 .6rem; }
.sub { color:var(--muted); font-size:.9rem; margin:0 0 1rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem; margin-bottom:1rem; }
label { display:block; font-size:.8rem; color:var(--muted); margin:.8rem 0 .2rem; }
input, textarea, select { width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.55rem .65rem; }
textarea { min-height:5rem; resize:vertical; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:.55rem .9rem; border-radius:8px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:#b33; }
.btns { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem; }
.w { display:flex; justify-content:space-between; align-items:center; gap:.6rem; padding:.7rem 0; border-bottom:1px solid var(--line); }
.w:last-child { border-bottom:0; }
.w b { display:block; font-weight:600; }
.w small { color:var(--muted); }
#msg { position:sticky; top:0; z-index:5; background:var(--accent); color:#fff; padding:.5rem .8rem; border-radius:8px; margin-bottom:.8rem; display:none; font-size:.9rem; }
#msg.err { background:#b33; }
details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<main>
<div id="msg"></div>
<h1>Editor</h1>
<p class="sub">Changes stay on this device until you press <b>Publish</b> or <b>Download</b>.</p>

<div class="card">
  <div class="btns" style="margin-top:0">
    <button class="primary" id="btnPublish">Publish to GitHub</button>
    <button id="btnDownload">Download data.json</button>
    <button id="btnOpen">Open a file…</button>
    <button id="btnDiscard">Discard local changes</button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<h2>Works</h2>
<div class="card" id="list"></div>
<button id="btnNew">+ New work</button>

<div class="card" id="formCard" style="display:none; margin-top:1rem">
  <b id="formTitle">New work</b>
  <label>Title *</label><input id="f_title">
  <div class="row">
    <div><label>Type</label><input id="f_type" placeholder="Kriti"></div>
    <div><label>Status</label><select id="f_status"><option value="complete">complete</option><option value="draft">draft (in progress)</option></select></div>
  </div>
  <div class="row">
    <div><label>Ankita</label><input id="f_ankita"></div>
    <div><label>Date</label><input id="f_date" type="date"></div>
  </div>
  <div class="row">
    <div><label>Raga</label><input id="f_raga"></div>
    <div><label>Tala</label><input id="f_tala"></div>
  </div>
  <label>Tags (comma separated)</label><input id="f_tags" placeholder="guru, avatara-traya">
  <label>Pallavi</label><textarea id="f_pallavi"></textarea>
  <label>Anupallavi</label><textarea id="f_anupallavi"></textarea>
  <label>Charanas (leave a blank line between charanas)</label><textarea id="f_charanas" style="min-height:12rem"></textarea>
  <label>Notes</label><textarea id="f_notes"></textarea>
  <label>Audio link (optional)</label><input id="f_audio" type="url" placeholder="https://…">
  <div class="btns">
    <button class="primary" id="btnSave">Save work</button>
    <button id="btnCancel">Cancel</button>
  </div>
</div>

<h2>Site details</h2>
<div class="card">
  <label>Name</label><input id="s_name">
  <label>Kannada name</label><input id="s_kn">
  <label>Dedication line</label><input id="s_offering">
  <label>Tagline</label><textarea id="s_tagline"></textarea>
  <label>Footer</label><input id="s_footer">
  <div class="row">
    <div><label>Copyright since (year)</label><input id="s_year" placeholder="2026"></div>
    <div><label>License name</label><input id="s_lname" placeholder="CC BY-NC-ND 4.0"></div>
  </div>
  <label>License link</label><input id="s_lurl" type="url" placeholder="https://creativecommons.org/licenses/by-nc-nd/4.0/">
  <label>License note (one line, shown in footer)</label><textarea id="s_lnote" style="min-height:3rem"></textarea>
  <div class="btns"><button id="btnSite">Save site details</button></div>
</div>

<h2>GitHub connection</h2>
<div class="card">
  <details>
    <summary>Set up once (so Publish works)</summary>
    <label>GitHub username</label><input id="g_owner">
    <label>Repository name</label><input id="g_repo">
    <div class="row">
      <div><label>Branch</label><input id="g_branch" placeholder="main"></div>
      <div><label>File path</label><input id="g_path" placeholder="data.json"></div>
    </div>
    <label>Access token (stored only in this browser)</label><input id="g_token" type="password" autocomplete="off">
    <div class="btns"><button id="btnGh">Save connection</button></div>
  </details>
</div>
</main>

<script>
var DRAFT_KEY = "kriti-draft-v1", GH_KEY = "kriti-gh-v1";
var data = { site: {}, works: [] }, editing = null;
var $ = function (id) { return document.getElementById(id); };

function msg(t, err) {
  var m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; m.style.display = "block";
  clearTimeout(msg.t); msg.t = setTimeout(function () { m.style.display = "none"; }, 5000);
}
function persist() { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); }
function slug() { return "w" + Date.now().toString(36); }

function renderList() {
  var box = $("list"); box.innerHTML = "";
  var rows = data.works.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
  if (!rows.length) box.textContent = "No works yet.";
  rows.forEach(function (w) {
    var d = document.createElement("div"); d.className = "w";
    var l = document.createElement("div");
    var b = document.createElement("b"); b.textContent = w.title;
    var s = document.createElement("small"); s.textContent = [w.type, w.date, w.status === "draft" ? "draft" : ""].filter(Boolean).join(" · ");
    l.appendChild(b); l.appendChild(s);
    var r = document.createElement("div");
    var e = document.createElement("button"); e.textContent = "Edit"; e.onclick = function () { openForm(w.id); };
    var x = document.createElement("button"); x.textContent = "Delete"; x.className = "danger"; x.style.marginLeft = ".4rem";
    x.onclick = function () {
      if (confirm("Delete “" + w.title + "”?")) {
        data.works = data.works.filter(function (k) { return k.id !== w.id; });
        persist(); renderList(); msg("Deleted (not yet published)");
      }
    };
    r.appendChild(e); r.appendChild(x);
    d.appendChild(l); d.appendChild(r); box.appendChild(d);
  });
}
function renderSite() {
  var s = data.site || {};
  $("s_name").value = s.name || ""; $("s_kn").value = s.kn || ""; $("s_offering").value = s.offering || "";
  $("s_tagline").value = s.tagline || ""; $("s_footer").value = s.footer || "";
  $("s_year").value = s.copyrightYear || ""; $("s_lname").value = s.licenseName || "";
  $("s_lurl").value = s.licenseUrl || ""; $("s_lnote").value = s.licenseNote || "";
}
function openForm(id) {
  editing = id;
  var w = data.works.filter(function (k) { return k.id === id; })[0] || {};
  $("formTitle").textContent = id ? "Edit work" : "New work";
  $("f_title").value = w.title || ""; $("f_type").value = w.type || "Kriti"; $("f_status").value = w.status || "complete";
  $("f_ankita").value = w.ankita || (data.site && data.site.name) || ""; $("f_date").value = w.date || new Date().toISOString().slice(0, 10);
  $("f_raga").value = w.raga || ""; $("f_tala").value = w.tala || "";
  $("f_tags").value = (w.tags || []).join(", ");
  $("f_pallavi").value = w.pallavi || ""; $("f_anupallavi").value = w.anupallavi || "";
  $("f_charanas").value = (w.charanas || []).join("\n\n");
  $("f_notes").value = w.notes || ""; $("f_audio").value = w.audio || "";
  $("formCard").style.display = "block";
  $("formCard").scrollIntoView({ behavior: "smooth" });
}
function saveWork() {
  var title = $("f_title").value.trim();
  if (!title) { msg("Title is required", true); return; }
  var w = {
    id: editing || slug(), title: title, type: $("f_type").value.trim(), status: $("f_status").value,
    ankita: $("f_ankita").value.trim(), date: $("f_date").value, raga: $("f_raga").value.trim(), tala: $("f_tala").value.trim(),
    tags: $("f_tags").value.split(",").map(function (t) { return t.trim(); }).filter(Boolean),
    pallavi: $("f_pallavi").value.trim(), anupallavi: $("f_anupallavi").value.trim(),
    charanas: $("f_charanas").value.split(/\n\s*\n/).map(function (c) { return c.trim(); }).filter(Boolean),
    notes: $("f_notes").value.trim(), audio: $("f_audio").value.trim()
  };
  Object.keys(w).forEach(function (k) { var v = w[k]; if (v === "" || (Array.isArray(v) && !v.length)) delete w[k]; });
  var i = data.works.findIndex(function (k) { return k.id === w.id; });
  if (i > -1) data.works[i] = w; else data.works.push(w);
  persist(); renderList(); $("formCard").style.display = "none"; editing = null;
  msg("Saved locally. Press Publish to put it online.");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function saveSite() {
  data.site = { name: $("s_name").value.trim(), kn: $("s_kn").value.trim(), offering: $("s_offering").value.trim(),
    tagline: $("s_tagline").value.trim(), footer: $("s_footer").value.trim(),
    copyrightYear: $("s_year").value.trim(), licenseName: $("s_lname").value.trim(),
    licenseUrl: $("s_lurl").value.trim(), licenseNote: $("s_lnote").value.trim() };
  persist(); msg("Site details saved locally");
}
function jsonText() { return JSON.stringify(data, null, 2) + "\n"; }
function download() {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([jsonText()], { type: "application/json" }));
  a.download = "data.json"; document.body.appendChild(a); a.click(); a.remove();
  msg("Downloaded. Replace data.json in your repo with this file.");
}
function gh() { try { return JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch (e) { return {}; } }
function saveGh() {
  var g = { owner: $("g_owner").value.trim(), repo: $("g_repo").value.trim(), branch: $("g_branch").value.trim() || "main",
    path: $("g_path").value.trim() || "data.json", token: $("g_token").value.trim() };
  localStorage.setItem(GH_KEY, JSON.stringify(g)); msg("Connection saved on this device");
}
function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function publish() {
  var g = gh();
  if (!g.owner || !g.repo || !g.token) { msg("Set up the GitHub connection first (bottom of page)", true); return; }
  var base = "https://api.github.com/repos/" + g.owner + "/" + g.repo + "/contents/" + g.path;
  var headers = { Authorization: "Bearer " + g.token, Accept: "application/vnd.github+json" };
  msg("Publishing…");
  fetch(base + "?ref=" + encodeURIComponent(g.branch), { headers: headers })
    .then(function (r) { if (r.status === 404) return {}; if (!r.ok) throw new Error("Could not read repo (" + r.status + ")"); return r.json(); })
    .then(function (cur) {
      var body = { message: "Update works", content: b64(jsonText()), branch: g.branch };
      if (cur.sha) body.sha = cur.sha;
      return fetch(base, { method: "PUT", headers: headers, body: JSON.stringify(body) });
    })
    .then(function (r) { if (!r.ok) throw new Error("Publish failed (" + r.status + "). Check token permissions."); return r.json(); })
    .then(function () { localStorage.removeItem(DRAFT_KEY); msg("Published. The site updates in about a minute."); })
    .catch(function (e) { msg(e.message, true); });
}
function loadRemote() {
  return fetch("data.json?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); });
}
function start(d) { data = d; data.site = data.site || {}; data.works = data.works || []; renderList(); renderSite(); }

$("btnNew").onclick = function () { openForm(null); };
$("btnSave").onclick = saveWork;
$("btnCancel").onclick = function () { $("formCard").style.display = "none"; };
$("btnSite").onclick = saveSite;
$("btnDownload").onclick = download;
$("btnPublish").onclick = publish;
$("btnGh").onclick = saveGh;
$("btnOpen").onclick = function () { $("file").click(); };
$("file").onchange = function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () { try { start(JSON.parse(r.result)); persist(); msg("File loaded"); } catch (e) { msg("Not a valid data.json", true); } };
  r.readAsText(f);
};
$("btnDiscard").onclick = function () {
  if (!confirm("Discard unpublished changes and reload from the live site?")) return;
  localStorage.removeItem(DRAFT_KEY);
  loadRemote().then(start).then(function () { msg("Reloaded from live site"); }).catch(function () { msg("Could not load data.json", true); });
};
(function init() {
  var g = gh();
  $("g_owner").value = g.owner || ""; $("g_repo").value = g.repo || ""; $("g_branch").value = g.branch || "main";
  $("g_path").value = g.path || "data.json"; $("g_token").value = g.token || "";
  var draft = localStorage.getItem(DRAFT_KEY);
  if (draft) { try { start(JSON.parse(draft)); msg("Restored your unpublished changes"); return; } catch (e) {} }
  loadRemote().then(start).catch(function () { start({ site: {}, works: [] }); msg("Couldn't load data.json. Use “Open a file…”", true); });
})();
</script>
</body>
</html>
