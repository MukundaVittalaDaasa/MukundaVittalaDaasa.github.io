function inlineMd(text,parent){
  var re=/(\*\*[^*]+\*\*|\*[^*\n]+\*|\[[^\]]+\]\([^)\s]+\))/g,last=0,m;

  verse:[[".verse","1.02rem"]],
  body:[[".md","1.02rem"],[".exc",".92rem"],[".note","1.02rem"]],
  small:[[".lbl",".72rem"],[".meta",".8rem"],[".count",".78rem"],[".tbtn",".72rem"],[".lc",".72rem"],[".chip",".78rem"],[".num",".78rem"],[".pallavi",".9rem"],["footer",".82rem"],["footer .copy",".76rem"],[".readbtn",".82rem"],["#q",".92rem"]]
};
function zval(t,k){
  var z=(t&&t.z)||{},v=z[k];
  if((v==null||v==="")&&k==="all")v=({s:94,l:112})[t&&t.size];
  v=Number(v);return(v>=50&&v<=200)?v:100;
}
/* site: pre="" (only changed groups are written); admin preview: pre="#zprev" (all groups, "all" kept as a variable) */
function sizeCss(t,pre){
  t=t||{};var out="",vars="",pv=pre?pre+" ":"";
  var all=zval(t,"all");
  if(pre)vars+="--z-all:"+(all/100)+";";
  else if(all!==100)out+="html{font-size:"+(16*all/100)+"px}";
  Object.keys(ZSEL).forEach(function(k){
    var v=zval(t,k);
    if(!pre&&v===100)return;
    vars+="--z-"+k+":"+(v/100)+";";
    ZSEL[k].forEach(function(p){
      out+=pv+p[0]+"{font-size:calc("+p[1]+"*var(--z-"+k+",1)*var(--z-all,1))}";
    });
  });
  return(vars?(pre||":root")+"{"+vars+"}":"")+out;
}

function baseTypes(){return(SITE.types&&SITE.types.length)?SITE.types:DEFAULT_TYPES;}
function types(){
  var out=baseTypes().slice(),seen={};out.forEach(function(t){seen[t.name]=1;});
  INDEX.forEach(function(w){if(!seen[w.type]){seen[w.type]=1;out.push({name:w.type,layout:w.l||"kriti",plural:w.type,sub:""});}});
  return out;
}
function typeInfo(name){return types().filter(function(t){return t.name===name;})[0];}
function layoutOf(w){var t=typeInfo(w.type);return t?t.layout:(w.l||(w.body?"article":w.verses?"verses":"kriti"));}
var _sorted=null;
function sorted(){if(!_sorted)_sorted=INDEX.slice().sort(function(a,b){return(b.date||"").localeCompare(a.date||"");});return _sorted;}
function ofType(name){return sorted().filter(function(w){return w.type===name;});}
function availableTabs(){
  return types().map(function(t){return{slug:slug(t.name),name:t.name,label:t.plural||(t.name+"s"),sub:t.sub||"",count:ofType(t.name).length};});
}
function hasAbout(){return true;}
function vals(o){return o?Object.keys(o).map(function(k){return o[k];}):[];}
function haystack(w){return[w.title,w.type,w.first,(w.tags||[]).join(" ")].join(" ").toLowerCase();}
function langName(k){var r=LANGS.filter(function(l){return l[0]===k;})[0];return r?r[1]:k;}
function pick(o){
  if(!o)return null;
  if(o[state.lang])return{text:o[state.lang],lang:state.lang};
  for(var i=0;i<LANGS.length;i++){var k=LANGS[i][0];if(o[k])return{text:o[k],lang:k,fallback:true};}
  return null;
}
function hasAny(o){return!!(o&&(o.en||o.kn||o.hi));}

function aboutLabel(){return SITE.aboutTitle||L("navAbout");}
function header(parent,small){
  var m=el("div","mast"+(small?" small":""),null,parent);
  if(!small&&SITE.offering)el("div","offer",SITE.offering,m);
  var h=el("h1","",null,m),a=el("a","",SITE.name||"",h);a.href="#/";
  if(SITE.kn)el("span","knname",SITE.kn,h);
  if(!small){
    if(SITE.tagline)el("p","tag",SITE.tagline,m);
    if(SITE.intro)el("p","intro",SITE.intro,m);
  }
}
function navLinks(ts,active){
  var out=[["about",aboutLabel(),"#/about"]];
  ts.forEach(function(t){out.push([t.slug,t.label,"#/t/"+t.slug]);});
  return out.map(function(x){return{key:x[0],label:x[1],href:x[2],on:x[0]===active};});
}
function tabsBar(parent,ts,active){
  var nav=el("nav","nav",null,parent);nav.setAttribute("aria-label","Sections");
  navLinks(ts,active).forEach(function(n){var a=el("a",n.on?"on":"",n.label,nav);a.href=n.href;if(n.on)a.setAttribute("aria-current","page");});
}
function footer(parent,noNav){
  var f=el("footer","",null,parent);
  if(!noNav){var fn=el("nav","fnav",null,f);
  navLinks(availableTabs(),"").forEach(function(n){var a=el("a","",n.label,fn);a.href=n.href;});}
  if(SITE.footer)el("div","ft",SITE.footer,f);
  var start=SITE.copyrightYear||"",now=String(new Date().getFullYear());
  var years=start&&start!==now&&now>start?start+"–"+now:(start||now);
  el("div","copy","© "+years+" "+(SITE.name||"")+(SITE.kn?" · "+SITE.kn:""),f);
  if(SITE.licenseName){
    var l=el("div","copy","Licensed under ",f);
    if(SITE.licenseUrl){var a2=el("a","",SITE.licenseName,l);a2.href=SITE.licenseUrl;a2.target="_blank";a2.rel="license noopener";}
    else l.appendChild(document.createTextNode(SITE.licenseName));
  }
  if(SITE.licenseNote)el("div","copy note2 ft",SITE.licenseNote,f);
}
function item(parent,w,n){
  var lay=layoutOf(w),a=el("a","item",null,parent);a.href="#/"+encodeURIComponent(w.id);
  el("div","num",String(n),a);
  var c=el("div","",null,a);
  el("div","title",w.title,c);
  var bits=[lay==="article"?w.date:"",w.status==="draft"?L("inProgress"):"",w.link?L("fullTag"):""].filter(Boolean).join(" · ");
  if(bits)el("div","meta"+(w.status==="draft"?" draft":""),bits,c);
  if(w.first){
    if(lay==="article")el("div","exc",w.first,c);
    else el("div","pallavi",(lay==="kriti"?L("pallavi")+": ":"")+w.first,c);
  }
}
function renderAbout(){
  el("h2","pt",aboutLabel(),app);
  md((SITE.about&&SITE.about.trim())?SITE.about:DEFAULT_ABOUT,el("div","md",null,app));
}
function renderHome(tabSlug){
  var ts=availableTabs();
  if(tabSlug!==""&&tabSlug!=="about"&&!ts.some(function(t){return t.slug===tabSlug;}))tabSlug="";
  if(state.tab!==tabSlug){state.tab=tabSlug;state.q="";state.tag="";state.shown=PAGE;}
  app.innerHTML="";
  if(tabSlug===""){
    var land=el("div","landing",null,app);header(land,false);
    var menu=el("nav","menu",null,land);menu.setAttribute("aria-label","Sections");
    var items=[{label:aboutLabel(),sub:L("aboutSub"),href:"#/about"}].concat(ts.map(function(t){return{label:t.label,sub:t.sub,href:"#/t/"+t.slug};}));
    items.forEach(function(it){var a=el("a","",null,menu);a.href=it.href;el("b","",it.label,a);if(it.sub)el("small","",it.sub,a);});
    footer(app,true);window.scrollTo(0,0);return;
  }
  header(app,true);tabsBar(app,ts,tabSlug);
  if(tabSlug==="about"){renderAbout();footer(app);window.scrollTo(0,0);return;}
  var tab=ts.filter(function(t){return t.slug===tabSlug;})[0],list=ofType(tab.name);
  el("h2","pt",tab.label,app);if(tab.sub)el("div","sub",tab.sub,app);
  var tagset={};list.forEach(function(w){(w.tags||[]).forEach(function(t){tagset[t]=1;});});
  var names=Object.keys(tagset).sort();
  if(state.tag&&names.indexOf(state.tag)<0)state.tag="";
  if(list.length>6){var q=el("input","",null,app);q.id="q";q.type="search";q.placeholder=L("search");q.value=state.q;}
  var chips=el("div","chips",null,app);
  if(names.length>1)names.forEach(function(t){
    var c=el("button","chip"+(state.tag===t?" on":""),t,chips);
    c.onclick=function(){state.tag=state.tag===t?"":t;state.shown=PAGE;renderHome(tabSlug);};
  });
  var count=el("div","count","",app),box=el("div","",null,app),moreWrap=el("div","",null,app);
  function draw(){
    box.innerHTML="";moreWrap.innerHTML="";
    var term=q?state.q.trim().toLowerCase():"";
    var rows=list.filter(function(w){return(!state.tag||(w.tags||[]).indexOf(state.tag)>-1)&&(!term||haystack(w).indexOf(term)>-1);});
    count.textContent=L(rows.length===1?"countOne":"countMany",{n:rows.length});
    if(!rows.length)el("div","empty",L("empty"),box);
    rows.slice(0,state.shown).forEach(function(w,i){item(box,w,i+1);});
    if(rows.length>state.shown){var b=el("button","chip more",L("showMore"),moreWrap);b.onclick=function(){state.shown+=PAGE;draw();};}
  }
  if(q)q.oninput=function(){state.q=q.value;state.shown=PAGE;draw();};
  draw();footer(app);
}
function loadWork(entry){
  if(entry._full)return Promise.resolve(entry);
  return fetch(entry.f+"?v="+encodeURIComponent(V||Date.now())).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(full){return Object.assign({},entry,full);});
}
function renderWork(id){
  var entry=sorted().filter(function(k){return k.id===id;})[0];
  if(!entry){location.hash="";return;}
  var my=++state.rid;
  app.innerHTML="";header(app,true);tabsBar(app,availableTabs(),slug(entry.type));el("p","empty",L("loading"),app);window.scrollTo(0,0);
  loadWork(entry).then(function(w){if(my===state.rid)showWork(w,entry);})
  .catch(function(){if(my!==state.rid)return;app.innerHTML="";el("p","empty",L("loadError"),app);});
}
function showWork(w,entry){
  var lay=layoutOf(w),list=ofType(w.type),i=list.indexOf(entry);
  var M=w.meanings||{},refresh=[],panels=[];
  app.innerHTML="";header(app,true);tabsBar(app,availableTabs(),slug(w.type));
  var ti=typeInfo(w.type),back=el("a","back","← "+(ti&&ti.plural?ti.plural:L("back")),app);back.href="#/t/"+slug(w.type);
  el("div","dt",w.title,app);
  var meta=[w.type];
  if(lay!=="article"){if(w.ankita)meta.push(L("ankita")+": "+w.ankita);if(w.raga)meta.push(L("raga")+": "+w.raga);if(w.tala)meta.push(L("tala")+": "+w.tala);}
  if(w.date)meta.push(w.date);
  el("div","meta",meta.filter(Boolean).join(" · "),app);
  if(w.audio){var au=el("audio","",null,app);au.controls=true;au.src=w.audio;}
  if(w.link){var rb=el("a","readbtn",L("readFull"),app);rb.href=w.link;if(/^https?:/i.test(w.link)){rb.target="_blank";rb.rel="noopener";}}
  var bar=el("div","bar",null,app);
  function langBox(o,box){
    var avail=LANGS.filter(function(l){return o&&o[l[0]];}),chips=el("div","lchips",null,box),txt=el("div","",null,box);
    var btns=avail.map(function(l){
      var b=el("button","lc",l[1],chips);b.type="button";
      b.onclick=function(e){e.stopPropagation();state.lang=l[0];lsSet("kriti-lang",l[0]);refresh.forEach(function(f){f();});};
      return[b,l[0]];
    });
    if(avail.length<2)chips.hidden=true;
    return function(){
      var k=o[state.lang]?state.lang:avail[0][0];
      txt.textContent=o[k];txt.setAttribute("data-l",k);
      btns.forEach(function(c){c[0].className="lc"+(c[1]===k?" on":"");});
    };
  }
  if(hasAny(w.summary)){
    var sb=el("div","sum",null,app);el("div","lbl",L("summary"),sb);
    refresh.push(langBox(w.summary,sb));
  }
  function sec(label,text,m){
    var wrap=el("div","sec",null,app);
    if(label)el("div","lbl",label,wrap);
    var has=hasAny(m),body=el("div","verse"+(has?" tap":""),text,wrap);
    if(!has)return;
    var btn=el("button","tbtn","ⓘ "+L("transBtn"),wrap);btn.type="button";btn.setAttribute("aria-expanded","false");
    var panel=el("div","mean",null,wrap);panel.hidden=true;panels.push(panel);
    var toggle=function(){panel.hidden=!panel.hidden;btn.setAttribute("aria-expanded",String(!panel.hidden));};
    btn.onclick=toggle;body.onclick=toggle;
    refresh.push(langBox(m,panel));
  }
  if(lay==="kriti"){
    if(w.pallavi)sec(L("pallavi"),w.pallavi,M.pallavi);
    if(w.anupallavi)sec(L("anupallavi"),w.anupallavi,M.anupallavi);
    (w.charanas||[]).forEach(function(c,k){sec(L("charana")+" "+(k+1),c,(M.charanas||[])[k]);});
  }else if(lay==="verses"){
    var vs=w.verses||[];
    vs.forEach(function(v,k){sec(vs.length>1?String(k+1):"",v,(M.verses||[])[k]);});
  }else{
    md(w.body,el("div","md",null,app));
  }
  if(panels.length){
    var all=el("button","chip",L("showAll"),bar),open=false;
    all.onclick=function(){open=!open;panels.forEach(function(p){p.hidden=!open;});all.textContent=open?L("hideAll"):L("showAll");};
  }
  refresh.forEach(function(f){f();});
  if(w.notes)el("div","note",w.notes,app);
  var pn=el("div","pn",null,app),prev=list[i+1],next=list[i-1];
  var l1=el("a","",prev?"← "+prev.title:"",pn);if(prev)l1.href="#/"+encodeURIComponent(prev.id);
  var r1=el("a","",next?next.title+" →":"",pn);if(next)r1.href="#/"+encodeURIComponent(next.id);
  footer(app);window.scrollTo(0,0);
}
function route(){
  var h=location.hash||"";
  if(!h||h==="#"||h==="#/")return renderHome("");
  var t=h.match(/^#\/t\/(.+)$/);
  if(t)return renderHome(decodeURIComponent(t[1]));
  var m=h.match(/^#\/(.+)$/),k=m?decodeURIComponent(m[1]):"";
  if(k==="about")return renderHome("about");
  if(k==="writings")return renderHome("");
  renderWork(k);
}
function shade(hex,p){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(c+(255-c)*p);}
  return"#"+[f(r),f(g),f(b)].map(function(c){return("0"+c.toString(16)).slice(-2);}).join("");
}
function applyTheme(){
  var t=SITE.theme||{},css="",root="";
  var acc=/^#[0-9a-f]{6}$/i.test(t.accent||"")?t.accent:"";
  if(acc){root+="--accent:"+acc+";";var d=shade(acc,.35);css+="@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--accent:"+d+"}}:root[data-theme=\"dark\"]{--accent:"+d+"}";}
  if(PAPERS[t.paper])root+="--bg:"+PAPERS[t.paper]+";";
  if(t.font==="sans")root+="--body:system-ui,-apple-system,\"Noto Sans Kannada\",\"Noto Sans Devanagari\",sans-serif;--kn:\"Noto Sans Kannada\",\"Noto Sans Devanagari\",sans-serif;";
  var fs="";
  if(t.font==="sans")root+="--head:system-ui,-apple-system,\"Noto Sans Kannada\",sans-serif;";
  var out=(root?":root{"+root+"}":"")+css+(fs?"html{font-size:"+fs+"}":"")+meanCss(t,"")+homeFontCss(t,"")+sizeCss(t,"");
  document.getElementById("themeStyle").textContent=out;
}
function getJson(u){
  return fetch(u+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json();});
}
function loadAll(){
  return getJson("data/site.json").then(function(s){
    return getJson("data/index.json").then(function(ix){SITE=s||{};INDEX=ix.works||[];V=String(ix.v||"");});
  }).catch(function(e){
    if(String(e.message)!=="404")throw e;
    return getJson("data.json").then(function(d){
      SITE=d.site||{};
      var ts=baseTypes();
      INDEX=(d.works||[]).map(function(w){
        var t=ts.filter(function(x){return x.name===w.type;})[0];
        var lay=t?t.layout:(w.body?"article":w.verses?"verses":"kriti");
        return Object.assign({},w,{_full:true,l:lay,first:firstOf(w,lay)});
      });
    });
  });
}
loadAll().then(function(){
  state.lang=lsGet("kriti-lang")||SITE.defaultLang||"en";
  document.title=SITE.title||((SITE.name||"")+(SITE.kn?" · "+SITE.kn:""));
  applyTheme();
  window.addEventListener("hashchange",route);
  route();
}).catch(function(){app.innerHTML="";el("p","empty",L("loadError"),app);});
document.getElementById("theme").onclick=function(){
  var r=document.documentElement;
  var dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
};
