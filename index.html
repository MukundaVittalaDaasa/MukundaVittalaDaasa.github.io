<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kritis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Kannada:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf7f0; --fg:#2b2622; --muted:#8a8177; --line:#e4ddcf; --accent:#a4562b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1a1714; --fg:#ece5d8; --muted:#9a9083; --line:#2f2a24; --accent:#d08a5b; } }
:root[data-theme="dark"] { --bg:#1a1714; --fg:#ece5d8; --muted:#9a9083; --line:#2f2a24; --accent:#d08a5b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Cormorant Garamond","Noto Serif Kannada",Georgia,serif; font-size:19px; line-height:1.7; }
main { max-width:34rem; margin:0 auto; padding:4.5rem 1.5rem 3rem; }
.kn { font-family:"Noto Serif Kannada",serif; }
.offer { text-align:center; color:var(--muted); font-size:.8rem; letter-spacing:.05em; }
h1 { text-align:center; font-weight:400; font-size:2.1rem; margin:1.2rem 0 .1rem; }
h1 span { display:block; font-family:"Noto Serif Kannada",serif; font-size:1.15rem; color:var(--accent); margin-top:.3rem; }
.tag { text-align:center; font-style:italic; color:var(--muted); margin:.8rem 0 0; white-space:pre-line; }
hr { border:0; border-top:1px solid var(--line); width:3rem; margin:2.5rem auto; }
#q { width:100%; background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--fg); font:inherit; font-size:.95rem; padding:.4rem 0; outline:none; }
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.8rem; }
.chip { background:none; border:1px solid var(--line); color:var(--muted); font:inherit; font-size:.8rem; padding:.05rem .7rem; border-radius:99px; cursor:pointer; }
.chip.on { color:var(--accent); border-color:var(--accent); }
.count { font-size:.8rem; color:var(--muted); margin:.9rem 0 .2rem; }
.item { display:block; padding:1.1rem 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
.item:first-child { border-top:1px solid var(--line); }
.title { font-family:"Noto Serif Kannada",serif; font-size:1.05rem; font-weight:600; }
.meta { font-size:.85rem; color:var(--muted); letter-spacing:.03em; }
.draft { font-style:italic; }
.pallavi { font-family:"Noto Serif Kannada",serif; font-size:.9rem; color:var(--accent); margin-top:.2rem; }
.empty { color:var(--muted); font-style:italic; padding:1.5rem 0; }
.back { color:var(--muted); font-size:.9rem; text-decoration:none; }
.dt { font-family:"Noto Serif Kannada",serif; font-size:1.4rem; font-weight:600; margin:1.5rem 0 .2rem; }
.lbl { font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:1.8rem 0 .2rem; }
.verse { font-family:"Noto Serif Kannada",serif; font-size:1rem; line-height:2; white-space:pre-line; }
.note { font-style:italic; color:var(--muted); margin-top:1.8rem; }
audio { width:100%; margin-top:1.5rem; }
.pn { display:flex; justify-content:space-between; gap:1rem; margin-top:3rem; font-size:.9rem; }
.pn a { color:var(--muted); text-decoration:none; }
footer { text-align:center; color:var(--muted); font-size:.85rem; margin-top:3rem; }
.toggle { position:fixed; top:calc(env(safe-area-inset-top,0px) + .8rem); right:1rem; background:none; border:0; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:.4rem; }
</style>
</head>
<body>
<button class="toggle" id="theme" aria-label="Toggle light or dark">◐</button>
<main id="app"><p class="empty">Loading…</p></main>
<script>
var SITE = {}, WORKS = [], state = { q: "", tag: "" };
var app = document.getElementById("app");

function el(tag, cls, text, parent) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function sorted() { return WORKS.slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }); }
function haystack(w) { return [w.title, w.type, w.pallavi, w.anupallavi, w.notes, (w.tags || []).join(" "), (w.charanas || []).join(" ")].join(" ").toLowerCase(); }
function header(parent) {
  if (SITE.offering) el("div", "offer kn", SITE.offering, parent);
  var h = el("h1", "", SITE.name || "", parent);
  if (SITE.kn) el("span", "", SITE.kn, h);
  if (SITE.tagline) el("p", "tag", SITE.tagline, parent);
  el("hr", "", null, parent);
}
function renderHome() {
  app.innerHTML = "";
  header(app);
  var q = el("input", "", null, app); q.id = "q"; q.type = "search"; q.placeholder = "Search"; q.value = state.q;
  var chips = el("div", "chips", null, app);
  var tags = {};
  WORKS.forEach(function (w) { (w.tags || []).forEach(function (t) { tags[t] = 1; }); });
  var names = Object.keys(tags).sort();
  if (names.length > 1) names.forEach(function (t) {
    var c = el("button", "chip" + (state.tag === t ? " on" : ""), t, chips);
    c.onclick = function () { state.tag = state.tag === t ? "" : t; renderHome(); };
  });
  var count = el("div", "count", "", app);
  var list = el("div", "", null, app);
  function draw() {
    list.innerHTML = "";
    var term = state.q.trim().toLowerCase();
    var rows = sorted().filter(function (w) {
      return (!state.tag || (w.tags || []).indexOf(state.tag) > -1) && (!term || haystack(w).indexOf(term) > -1);
    });
    count.textContent = rows.length + (rows.length === 1 ? " work" : " works");
    if (!rows.length) el("div", "empty", "Nothing here yet.", list);
    rows.forEach(function (w) {
      var a = el("a", "item", null, list); a.href = "#/" + w.id;
      el("div", "title", w.title, a);
      var bits = [w.type, w.ankita ? "Ankita: " + w.ankita : "", w.status === "draft" ? "in progress" : ""].filter(Boolean).join(" · ");
      el("div", "meta" + (w.status === "draft" ? " draft" : ""), bits, a);
      if (w.pallavi) el("div", "pallavi", "ಪಲ್ಲವಿ: " + w.pallavi, a);
    });
  }
  q.oninput = function () { state.q = q.value; draw(); };
  draw();
  if (SITE.footer) el("footer", "", SITE.footer, app);
}
function renderWork(id) {
  var rows = sorted();
  var i = rows.findIndex(function (w) { return w.id === id; });
  if (i < 0) { location.hash = ""; return; }
  var w = rows[i];
  app.innerHTML = "";
  var back = el("a", "back", "← All works", app); back.href = "#";
  el("div", "dt", w.title, app);
  el("div", "meta", [w.type, w.ankita ? "Ankita: " + w.ankita : "", w.raga ? "Raga: " + w.raga : "", w.tala ? "Tala: " + w.tala : "", w.date || ""].filter(Boolean).join(" · "), app);
  if (w.audio) { var au = el("audio", "", null, app); au.controls = true; au.src = w.audio; }
  if (w.pallavi) { el("div", "lbl", "ಪಲ್ಲವಿ", app); el("div", "verse", w.pallavi, app); }
  if (w.anupallavi) { el("div", "lbl", "ಅನುಪಲ್ಲವಿ", app); el("div", "verse", w.anupallavi, app); }
  (w.charanas || []).forEach(function (c, k) { el("div", "lbl", "ಚರಣ " + (k + 1), app); el("div", "verse", c, app); });
  if (w.notes) el("div", "note", w.notes, app);
  var pn = el("div", "pn", null, app);
  var prev = rows[i + 1], next = rows[i - 1];
  var l = el("a", "", prev ? "← " + prev.title : "", pn); if (prev) l.href = "#/" + prev.id;
  var r = el("a", "", next ? next.title + " →" : "", pn); if (next) r.href = "#/" + next.id;
  if (SITE.footer) el("footer", "", SITE.footer, app);
  window.scrollTo(0, 0);
}
function route() {
  var m = location.hash.match(/^#\/(.+)$/);
  if (m) renderWork(decodeURIComponent(m[1])); else renderHome();
}
fetch("data.json?v=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    SITE = d.site || {}; WORKS = d.works || [];
    document.title = (SITE.name || "Kritis") + (SITE.kn ? " · " + SITE.kn : "");
    window.addEventListener("hashchange", route);
    route();
  })
  .catch(function () {
    app.innerHTML = "";
    el("p", "empty", "Could not load data.json. If you opened this file directly from your device, host it (see README) or run a local server.", app);
  });
document.getElementById("theme").onclick = function () {
  var r = document.documentElement;
  var dark = r.getAttribute("data-theme") === "dark" || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme", dark ? "light" : "dark");
};
</script>
</body>
</html>
