        return Object.assign({},w,{_full:true,l:lay,first:firstOf(w,lay)});
      });
    });
  });
}
loadAll().then(function(){
  state.lang=lsGet("kriti-lang")||SITE.defaultLang||"en";
  document.title=SITE.title||(SITE.name||"");
  applyTheme();
  window.addEventListener("hashchange",route);
  route();
}).catch(function(){app.innerHTML="";el("p","empty",L("loadError"),app);});
/* live preview inside the editor (same origin only) */
window.addEventListener("message",function(e){
  var d=e.data;if(e.origin!==location.origin||!d||d.kriti!=="preview")return;
  PREVIEWING=true;
  if(d.site)SITE=d.site;
  if(d.index){INDEX=d.index;_sorted=null;}
  PREVIEW=d.works||{};
  state.lang=lsGet("kriti-lang")||SITE.defaultLang||"en";
  applyTheme();
  document.title=SITE.title||(SITE.name||"");
  if(typeof d.hash==="string"&&location.hash!==d.hash&&!(d.hash==="#/"&&location.hash==="")){location.hash=d.hash;}else route();
});
document.addEventListener("click",function(e){
  if(!PREVIEWING)return;
  var t=e.target;if(!t||!t.closest)return;
  var ek=elAt(t,baseTypes().map(function(x){return{name:x.name,plural:x.plural,layout:x.layout};}),document.body.getAttribute("data-ty")||"");
  if(ek){e.preventDefault();e.stopPropagation();parent.postMessage({kriti:"pick",group:"",el:ek},location.origin);return;}
  var order=["mean","verse","home","nav","head","body","small"];
  for(var i=0;i<order.length;i++){
    var g=order[i],sels=g==="mean"?[".mean",".sum"]:ZSEL[g].map(function(p){return p[0];});
    for(var j=0;j<sels.length;j++){if(t.closest(sels[j])){e.preventDefault();e.stopPropagation();parent.postMessage({kriti:"pick",group:g},location.origin);return;}}
  }
  var a=t.closest("a");if(a){e.preventDefault();}
},true);
document.getElementById("theme").onclick=function(){
  var r=document.documentElement;
  var dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
};
